# MiniCPM-o 4.5 Simplex Training Configuration
#
# Turn-based SFT over image / audio / video conversations.  Videos are
# decoded into frames (fps sampling) plus their audio track.  Media paths in
# the dataset are resolved against each dataset entry's `data_folder`.
#
# Override paths at launch time:
#   model_config.load_from_pretrained_path=/path/to/MiniCPM-o-4_5
#   dataset_config.processor_config.processor_name=/path/to/MiniCPM-o-4_5
#   dataset_config.datasets.0.path=/path/to/parquet
#   dataset_config.datasets.0.data_folder=/path/to/media/root

trainer_type: fsdp2_trainer

dataset_config:
  dataset_type: minicpmo_iterable
  dataset_format: yaml
  dataset_path: null
  processor_config:
    processor_name: openbmb/MiniCPM-o-4_5   # Override: local checkpoint path
    processor_type: minicpmo
    extra_kwargs:
      max_slice_nums: 9          # high-resolution image slicing
      use_audio_in_video: true    # feed the video's audio track as well

  datasets:
    - path: null                 # Override: path to parquet/json/jsonl
      data_folder: null           # Override: root folder for media files
      data_type: parquet

  shuffle: true
  eval_dataset_path: null
  object_storage: none
  bucket_name: null

  packing: false
  packing_strategy: first_fit
  packing_length: 8192
  filter_overlong: true
  filter_overlong_workers: 8
  max_length: null

  video_sampling_strategy: fps
  video_max_pixels: 602112
  video_max_frames: 64
  frame_num: 32
  fps: 1.0
  video_backend: decord  # minicpmo decodes videos with PyAV internally

trainer_args:
  output_dir: ./output/minicpmo_simplex
  do_train: true
  do_eval: false
  eval_strategy: 'no'
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 1.0e-05
  weight_decay: 0.0
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-08
  max_grad_norm: 1.0
  num_train_epochs: 1
  max_steps: -1
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  logging_steps: 1
  save_strategy: steps
  save_steps: 500
  save_total_limit: 2
  save_safetensors: true
  bf16: true
  tf32: true
  seed: 42
  dataloader_num_workers: 4
  dataloader_drop_last: true
  remove_unused_columns: false
  report_to: []
  gradient_checkpointing: true

  # FSDP2
  fsdp2: true
  sp_ulysses_degree: 1
  reduce_dtype: bfloat16
  output_dtype: bfloat16
  fsdp_config:
    transformer_layer_cls_to_wrap:
    - Qwen3DecoderLayer
    reshard_after_forward: false

  # MiniCPM-o specific
  freeze_modules:
  - tts          # the speech head is frozen (text-side SFT only)
  use_rmpad: false
  use_liger_kernel: false
  print_batch_input_steps: 5

model_config:
  extra_kwargs: {}
  load_from_pretrained_path: openbmb/MiniCPM-o-4_5   # Override: local checkpoint path
  load_from_config: null
  attn_implementation: flash_attention_2
  model_type: minicpmo
  torch_dtype: bfloat16
  overwrite_config: null
  monkey_patch_kwargs: null
