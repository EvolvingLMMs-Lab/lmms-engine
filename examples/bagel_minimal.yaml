- type: trainer
  config:
    trainer_type: hf_trainer

    dataset_config:
      dataset_type: bagel_iterable
      dataset_format: yaml
      datasets:
        - path: examples/bagel_data/bagel_minimal.json
          data_folder: ""
          data_type: json
      processor_config:
        processor_name: "Qwen/Qwen2-7B-Instruct"
        processor_type: "bagel"
        extra_kwargs:
          image_stride: 16
          max_image_size: 224
          min_image_size: 224
          vit_patch_size: 14
          max_num_patch_per_side: 70
          interpolate_pos: false
          # disable VAE latents in minimal run
          vae_image_downsample: 16
          max_latent_size: 64
      packing: false

    model_config:
      load_from_config:
        model_type: "bagel"
        config: {}
      attn_implementation: "eager"
      extra_kwargs:
        training_config:
          # Minimal run: disable visual branches
          visual_gen: false
          visual_und: false
          compile_flex_attention: false

    per_device_train_batch_size: 1
    learning_rate: 1.0e-4
    weight_decay: 0.0
    gradient_accumulation_steps: 1
    gradient_checkpointing: false
    num_train_epochs: 1
    save_steps: 50
    save_total_limit: 1
    report_to: "none"
    output_dir: "./output/bagel_minimal"
    warmup_ratio: 0.0
    run_name: "bagel_minimal"
    eval_strategy: "no"
    logging_steps: 1
    group_by_length: false
    dataloader_num_workers: 0
    bf16: true
    lr_scheduler_type: "cosine"
    use_liger_kernel: false
    use_rmpad: false
