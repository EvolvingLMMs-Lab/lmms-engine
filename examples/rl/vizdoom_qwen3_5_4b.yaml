# Minimal Qwen3.5-4B + VizDoom RL config.
# Rollout docs are engine-side train data; lmms-eval only provides env/parsers.

trainer_type: fsdp2_grpo_rl_trainer

dataset_config:
  dataset_type: qwen3_vl_iterable
  dataset_format: yaml
  dataset_path: null
  processor_config:
    processor_name: /mnt/umm/users/pufanyi/workspace/lmms-engine/data/checkpoints/Qwen3.5-4B
    processor_type: qwen3_vl
    extra_kwargs:
      video_max_pixels: 360448
      video_min_pixels: 28800
      image_max_pixels: 360448
      image_min_pixels: 28800
  object_storage: none
  packing: false
  video_sampling_strategy: fps
  video_max_pixels: 360448
  video_max_frames: 64
  video_min_pixels: 28800
  frame_num: 32
  fps: 1
  video_backend: qwen_vl_utils

trainer_args:
  output_dir: ./output/qwen3_5_4b_vizdoom_rl_100k
  do_train: true
  do_eval: false
  eval_strategy: "no"
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 1
  learning_rate: 1.0e-6
  weight_decay: 0.0
  max_grad_norm: 1.0
  max_steps: 3125 # 100k rollout specs / default 4-node RL batch 32.
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  logging_steps: 1
  save_strategy: steps
  save_steps: 1000000
  bf16: true
  tf32: true
  dataloader_drop_last: true
  dataloader_num_workers: 0
  remove_unused_columns: false
  gradient_checkpointing: true
  use_liger_kernel: false
  use_rmpad: false
  fsdp2: true
  fsdp_config:
    transformer_layer_cls_to_wrap:
      - Qwen3_5DecoderLayer
    reshard_after_forward: false
    min_num_params: 0
  sp_ulysses_degree: 1
  reduce_dtype: bfloat16
  output_dtype: bfloat16
  optim: adamw_torch_fused
  seed: 42
  run_name: qwen3_5_4b_vizdoom_rl_100k
  print_batch_input_steps: 5
  report_to:
    - tensorboard

  rl_config:
    save_final_checkpoint: false
    sync_policy_weights: false
    rollout_seed: 42
    rollout_poll_s: 0.1
    rollout_sleep_s: 0.05

    task:
      task_name: vizdoom
      data_path: examples/rl/data/vizdoom_train.jsonl
      data_format: jsonl
      limit: 100
      repeats: 1000 # 100 base docs x 1000 repeats = 100k rollout episode specs.
      model_output_parser: qwen
      max_steps: 10
      seed: 42
      generation_kwargs:
        max_new_tokens: 32
        temperature: 1.0
        top_p: 0.9
        do_sample: true

    model_server:
      name: ray_actor_pool
      actor_name_prefix: qwen3-5-4b-vizdoom-policy
      num_replicas: 24
      actor_options:
        num_gpus: 1
      server:
        factory: lmms_engine.rl.model_server.vllm:VLLMChatModelServer
        model: /mnt/umm/users/pufanyi/workspace/lmms-engine/data/checkpoints/Qwen3.5-4B
        dtype: bfloat16
        trust_remote_code: true
        gpu_memory_utilization: 0.85
        max_num_seqs: 8
        system_prompt: "You are a careful VizDoom agent. Choose one valid action for the current frame."
        generation_kwargs:
          max_new_tokens: 32
          temperature: 1.0
          top_p: 0.9
          do_sample: true

    rollout:
      backend: ray
      num_workers: 24
      max_inflight_per_worker: 1
      batch_size: 2
      poll_timeout_s: 0.0

    data_buffer:
      backend: in_memory
      max_trajectories: 256
      high_watermark: 192
      low_watermark: 64
      train_batch_size: 32
      min_trajectories_per_batch: 32

    training:
      trainer_type: fsdp2_grpo_rl_trainer
      global_batch_size: 32
      update_weights_every_steps: 10
      batch_builder: fixed_global

    algorithm:
      reward_key: vizdoom_total_reward
      fallback_to_total_reward: true
      use_step_rewards: false
      normalize_advantages: true
      beta: 0.0
      system_message: "You are a careful VizDoom agent. Choose one valid action for the current frame."
      processor_kwargs: {}

    ray_init_kwargs:
      ignore_reinit_error: true

model_config:
  load_from_pretrained_path: /mnt/umm/users/pufanyi/workspace/lmms-engine/data/checkpoints/Qwen3.5-4B
  attn_implementation: sdpa
  torch_dtype: bfloat16
  model_general_type: image_text_to_text
  monkey_patch_kwargs:
    patch_type: []

extra_kwargs: null
