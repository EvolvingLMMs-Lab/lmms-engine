# Qwen3.5-4B + VizDoom RL config.
# Four-node defaults: one 8-GPU FSDP2 train node plus three 8-GPU Ray vLLM
# rollout nodes. For a local 8-GPU smoke run, override train/vLLM counts from
# the CLI to split the single node explicitly.

rl_runtime:
  enabled: true
  nnodes: 4
  gpus_per_node: 8
  master_addr: null
  ray_port: "6379"
  node_rank: "0"
  train_node_rank: "0"
  head_node_ip: null
  wait_timeout: 300

trainer_type: fsdp2_grpo_rl_trainer

dataset_config:
  dataset_type: qwen3_vl_iterable
  dataset_format: yaml
  dataset_path: null
  processor_config:
    processor_name: /mnt/umm/users/pufanyi/workspace/lmms-engine/data/checkpoints/Qwen3.5-4B
    processor_type: qwen3_vl
    extra_kwargs:
      video_max_pixels: 360448
      video_min_pixels: 28800
      image_max_pixels: 360448
      image_min_pixels: 28800
  object_storage: none
  packing: false
  video_sampling_strategy: fps
  video_max_pixels: 360448
  video_max_frames: 64
  video_min_pixels: 28800
  frame_num: 32
  fps: 1
  video_backend: qwen_vl_utils

trainer_args:
  output_dir: ./output/qwen3_5_4b_vizdoom_rl_100k
  do_train: true
  do_eval: false
  eval_strategy: "no"
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 1
  learning_rate: 1.0e-6
  weight_decay: 0.0
  max_grad_norm: 1.0
  max_steps: 12500 # 100k rollout specs / default 4-node train batch: 1 per GPU * 8 GPUs.
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  logging_steps: 1
  save_strategy: steps
  save_steps: 1000000
  bf16: true
  tf32: true
  dataloader_drop_last: true
  dataloader_num_workers: 0
  remove_unused_columns: false
  gradient_checkpointing: true
  use_liger_kernel: false
  use_rmpad: false
  fsdp2: true
  fsdp_config:
    transformer_layer_cls_to_wrap:
      - Qwen3_5DecoderLayer
    reshard_after_forward: false
    min_num_params: 0
  sp_ulysses_degree: 1
  reduce_dtype: bfloat16
  output_dtype: bfloat16
  optim: adamw_torch_fused
  seed: 42
  run_name: qwen3_5_4b_vizdoom_rl_100k
  print_batch_input_steps: 5
  report_to:
    - tensorboard

  rl_config:
    save_final_checkpoint: false
    sync_policy_weights: true
    sync_initial_policy_weights: true
    sync_drain_inflight_rollouts: true
    sync_drain_timeout_s: 1800.0
    sync_drain_poll_s: 0.1
    policy_sync_merge_to_hf: true
    policy_sync_keep_last: 2
    update_weight_mode: full
    update_weight_transport: disk
    update_weight_disk_dir: /mnt/umm/users/pufanyi/workspace/lmms-engine/output/qwen3_5_4b_vizdoom_rl_100k/policy-sync
    rollout_seed: 42
    rollout_poll_s: 0.1
    rollout_sleep_s: 0.05
    train_shard_log_steps: 3

    task:
      task_name: vizdoom
      data_path: examples/rl/data/vizdoom_train.jsonl
      data_format: jsonl
      limit: 100
      repeats: 1000 # 100 base docs x 1000 repeats = 100k rollout episode specs.
      observation_parser:
        name: vizdoom
        human_view: true
        video: false
        image_buffers: ["screen"]
        require_thinking: true
      model_output_parser: qwen
      loop_worker:
        name: simple
        multiturn: true
        history_turns: 2
      max_steps: 64 # VizDoom basic uses tics_per_action=12; 64 decisions covers 280-315 tic episodes.
      seed: 42
      generation_kwargs:
        max_new_tokens: 64
        temperature: 1.0
        top_p: 0.9
        do_sample: true

    model_server:
      name: ray_actor_pool
      actor_name_prefix: qwen3-5-4b-vizdoom-policy
      num_replicas: 24
      actor_options:
        num_gpus: 1
      server:
        factory: lmms_engine.rl.model_server.vllm:VLLMChatModelServer
        model: /mnt/umm/users/pufanyi/workspace/lmms-engine/data/checkpoints/Qwen3.5-4B
        dtype: bfloat16
        trust_remote_code: true
        gpu_memory_utilization: 0.85
        max_model_len: 32768
        max_num_seqs: 8
        system_prompt: "You are a careful VizDoom agent. Choose one valid action for the current frame."
        generation_kwargs:
          max_new_tokens: 64
          temperature: 1.0
          top_p: 0.9
          do_sample: true

    rollout:
      backend: ray
      num_workers: 96
      max_inflight_per_worker: 1
      batch_size: 8
      poll_timeout_s: 0.0

    data_buffer:
      backend: in_memory
      max_trajectories: 4096
      high_watermark: 3072
      low_watermark: 1024
      train_batch_size_per_gpu: 1
      global_train_batch_size: null
      min_trajectories_per_batch: null

    training:
      trainer_type: fsdp2_grpo_rl_trainer
      global_batch_size: null
      update_weights_every_steps: 10
      batch_builder: fixed_global

    algorithm:
      reward_key: vizdoom_total_reward
      fallback_to_total_reward: true
      use_step_rewards: false
      normalize_advantages: true
      max_steps_per_trajectory: 8
      step_sampling_strategy: uniform
      beta: 0.0
      system_message: "You are a careful VizDoom agent. Choose one valid action for the current frame."
      processor_kwargs: {}

    ray_init_kwargs:
      ignore_reinit_error: true

    weight_sync:
      reset_prefix_cache: true
      sleep_level: null
      preflight_weight_path: true
      require_hf_checkpoint: true

ray_train:
  num_workers: 8
  use_gpu: true
  resources_per_worker:
    GPU: 1
  placement_strategy: PACK

model_config:
  load_from_pretrained_path: /mnt/umm/users/pufanyi/workspace/lmms-engine/data/checkpoints/Qwen3.5-4B
  attn_implementation: sdpa
  torch_dtype: bfloat16
  model_general_type: image_text_to_text
  monkey_patch_kwargs:
    patch_type: []

extra_kwargs: null
