- type: trainer
  config:
    trainer_type: hf_trainer

    dataset_config:
      dataset_type: qwen_omni
      dataset_format: json
      dataset_path: 
      eval_dataset_path: 

      processor_config:
        processor_name: "Qwen/Qwen2.5-Omni-7B"
        processor_type: "Qwen2_5OmniProcessor"
        extra_kwargs:
          audio_max_length: 60
          video_max_pixels: 602112
          video_min_pixels: 28800
          image_max_pixels: 602112
          image_min_pixels: 28800

      extra_kwargs:
        use_audio_in_video: true

      video_backend: "qwen_omni_utils"
      video_sampling_strategy: "fps"
      fps: 1


    model_config:
      load_from_pretrained_path: "Qwen/Qwen2.5-Omni-7B"
      attn_implementation: "flash_attention_2"
      model_type: "qwen2_5_omni"
      torch_dtype: "bfloat16"

    per_device_train_batch_size: 1
    per_device_eval_batch_size: 1
    learning_rate: 1.0e-05
    weight_decay: 0.0
    gradient_accumulation_steps: 16
    gradient_checkpointing: true
    num_train_epochs: 1
    save_steps: 100
    save_total_limit: 3
    report_to: "wandb"
    output_dir: ""
    warmup_ratio: 0.0
    run_name: ""
    eval_strategy: "steps"
    eval_steps: 100
    logging_steps: 5
    group_by_length: false
    dataloader_num_workers: 0
    bf16: true
    lr_scheduler_type: "constant"
    torch_empty_cache_steps: 10
    use_liger_kernel: true
    use_rmpad: true

    fsdp: "full_shard"
    fsdp_config:
      fsdp_transformer_layer_cls_to_wrap: ["Qwen2_5OmniDecoderLayer", "Qwen2_5OmniAudioEncoderLayer", "Qwen2_5OmniVisionBlock"]
      fsdp_backward_prefetch: "backward_pre"
      fsdp_state_dict_type: "sharded_state_dict"
      fsdp_use_orig_params: true
